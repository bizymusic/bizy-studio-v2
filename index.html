<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- 1. 全局基础样式 -->
  <link rel="stylesheet" href="/src/styles/global.css">
  
  <!-- 2. 导航组件独立样式 -->
  <link rel="stylesheet" href="/src/styles/nav.css">
  
  <!-- 3. MIDI / 特定页面样式 (在 midi 页面引入) -->
  <link rel="stylesheet" href="/src/styles/midi.css">


  <title>Bizy Sound</title>
  <link rel="icon" href="/favicon.ico?v=1" />
    <script>
      window.global = window; // 必须在所有 JS 加载前执行
      window.process = window.process || { env: { NODE_ENV: 'production' } };
    // 专门解决 Cloudflare 构建报错及 Magenta 运行时缺失 hrtime 的补丁
    (function() {
      const p = window.process || {};
      if (!p.hrtime) {
        p.hrtime = function() {
          const now = performance.now();
          const seconds = Math.floor(now / 1000);
          const nanoseconds = Math.floor((now % 1000) * 1000000);
          return [seconds, nanoseconds];
        };
      }
      window.process = p;
      window.global = window;
    })();
  </script>
</head>

<body>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
